name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: >
          uv run --frozen pytest -v
          --cov=decodability
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Run pre-commit (non-Windows only)
        if: matrix.os != 'windows-latest'
        run: uv run --frozen pre-commit run -a

      - name: Run gitleaks checkout scan (non-Windows only)
        if: matrix.os != 'windows-latest'
        run: uv run --frozen pre-commit run --hook-stage manual gitleaks-ci -a
